# /opt/dns-to-bgp/conf.d/state.conf - configuration of unbound-route-state.
#
# All addresses and AS numbers below are documentation placeholders
# (RFC 5737 / RFC 3849 / RFC 6996). Replace them with your own.
#
# Topology assumed by this example: BIRD (192.0.2.10, AS 64512) and this daemon
# (192.0.2.11, AS 64512) form an iBGP session. The daemon is passive: it listens
# on TCP port 1790 and BIRD connects to it (see examples/bird/dns-bgp.conf).

[general]
# UNIX socket on which the daemon receives events from the Unbound module.
# Must match route_state_socket in announcer.conf.
listen_socket       = /run/dns-to-bgp/state.sock
socket_mode         = 0660
max_inbound_conns   = 2

# At most N WARN messages per minute for each kind of warning
# (repeats are collapsed into a counter). 0 = unlimited.
log_rate_limit_per_min = 60

# Control socket used by `unbound-route-state ctl ...` (stats, routes, rules, bgp).
# Separate from listen_socket. An empty value disables it.
control_socket         = /run/dns-to-bgp/control.sock
control_socket_mode    = 0660

# Remember the FQDN(s) of every live IP (shown by `ctl routes`). Costs about one
# short string per (IP, domain) pair: a few MB for tens of thousands of IPs.
track_fqdn             = yes

asn                 = 64512
router_id           = 192.0.2.11
local_address       = 192.0.2.11

# Default NEXT_HOP, one per address family (RFC 4760: the next hop must be of the
# same family as the NLRI, even when the session itself is IPv4). Used when the
# matching rule in communities.conf does not set its own next_hop / next_hop_v6.
#   next_hop    - for IPv4 routes (A records). Empty = local_address.
#   next_hop_v6 - for IPv6 routes (AAAA records). REQUIRED for any IPv6:
#                 empty = IPv6 routes are not announced at all (logged as an error).
next_hop            =
next_hop_v6         =

# The BGP peer (BIRD): its address and AS number.
neighbor            = 192.0.2.10
neighbor_asn        = 64512

# passive = yes: this daemon listens (port 1790) and BIRD connects to it.
# passive = no : this daemon connects out to neighbor:remote_port.
passive             = yes
remote_port         = 0     # not used when passive = yes

hold_time_seconds              = 240

# Session recovery (only when the daemon is the ACTIVE side, passive = no).
# connect_retry_seconds - how often the daemon re-dials the peer while the session
#                         is down (minimum 2; the GoBGP default is 120 s).
# idle_hold_seconds     - pause before reconnecting after a session reset
#                         (minimum 1; the GoBGP default is 30 s).
connect_retry_seconds          = 10
idle_hold_seconds              = 5
graceful_restart                = yes
graceful_restart_time_seconds   = 300
llgr_enabled                    = yes
llgr_stale_time                 = 600

[limits]
max_ip_entries       = 50000
# Size of the channel between the socket reader and the route table. When it is
# full, events are dropped (never blocked or retried) and the drop is logged.
# Raise it if "events channel full" shows up under normal (non-burst) load.
event_queue_size     = 4096
# Cap on the number of patterns that come from *.list files referenced in
# communities.conf.
max_domain_patterns  = 5000

[ttl]
granularity_seconds     = 1
# Minimum route lifetime regardless of the DNS TTL (0 = follow the TTL exactly).
min_route_ttl_seconds   = 0

[communities]
rules_file = /opt/dns-to-bgp/conf.d/communities.conf
# Hot reload of rules_file without a restart: check period (mtime + size),
# 0 = off. An invalid or empty file is rejected and the previous rules stay.
# Routes that are already announced are not recomputed; new rules apply to
# events that arrive after the swap.
rules_reload_seconds = 5
# Directory of *.list files that may be referenced in block headers of
# communities.conf (for example [corp.list, *.extra.example.com]). Editing a list
# is picked up the same way as editing communities.conf itself.
domains_dir = /opt/dns-to-bgp/domains.d

[keepalive]
# Keep a route while traffic to its IP is flowing, even after the DNS TTL has
# expired (any protocol conntrack sees: the server forwards and NATs clients).
# Every poll_interval_seconds the daemon asks the kernel (`conntrack -L`) which
# cached IPs have live flows and extends their routes to lease_seconds after the
# last sighting. Requires the conntrack package and CAP_NET_ADMIN (see the
# systemd unit). Disabled by default.
enabled                = no
conntrack_command      = /usr/sbin/conntrack
conntrack_args         =

# How often to poll. Every route lives at least 2 * poll_interval_seconds
# (automatically) so that at least one poll can see it.
poll_interval_seconds  = 15

# How long to keep a route after the last observed flow (hysteresis: the client's
# next connection soon after the previous one should take the same path).
lease_seconds          = 600

# Ceiling for one series of extensions, counted from the first sighting (a new
# DNS answer for the IP restarts the count). Protects against a stuck flow.
# 0 = no ceiling.
max_hold_seconds       = 86400

# Idle TCP connections. 0 = rely on the kernel's own timeout
# (net.netfilter.nf_conntrack_tcp_timeout_established, read from /proc/sys):
# an entry in conntrack means the connection is still alive by the kernel's
# standards. >0 = count an established TCP connection as active only if it saw a
# packet within the last N seconds (idle time = kernel timeout - entry's
# remaining time). tcp_established_timeout_seconds sets the kernel timeout by
# hand (0 = read it from /proc).
tcp_idle_limit_seconds          = 0
tcp_established_timeout_seconds = 0

[unbound]
# Flush names from the Unbound cache when the daemon starts. Unbound answers
# repeated queries from its cache without calling the Python module, so after a
# daemon restart (empty route table) cached names do not reach the BGP feed
# until their TTL expires. Flushing them makes Unbound resolve them again, and
# routes are repopulated as soon as clients ask. Runs once, after the socket for
# the Python module has started accepting connections. Disabled by default.
flush_on_start     = no

# How to call unbound-control. control_args are extra space-separated arguments
# placed before the command (for example -c with the path to unbound.conf, or -s
# with a remote-control address). The daemon's user must be able to read the
# Unbound remote-control keys (control-enable: yes in unbound.conf).
control_command    = /usr/sbin/unbound-control
control_args       =

# Where to take names from: the directory of *.list files used by the announcer
# (patterns from communities.conf are included as well). Empty = only the
# patterns from communities.conf.
flush_domains_dir  = /opt/dns-to-bgp/domains.d

# Safety limits: flush_zone walks the whole Unbound cache and is slow, so the
# number of commands is capped and there is a pause between them.
flush_max_commands = 500
flush_pause_ms     = 20
