# /opt/dns-to-bgp/conf.d/announcer.conf - configuration of the Unbound Python module.
# Default path; override with the DNS_BGP_ANNOUNCER_CONFIG environment variable
# of the Unbound process.

[general]
# UNIX socket of unbound-route-state (its listen_socket).
route_state_socket     = /run/dns-to-bgp/state.sock
connect_timeout_ms     = 50
send_timeout_ms        = 20
reconnect_backoff_ms   = 500
log_rate_limit_per_min = 60

[domains]
# Directory of *.list files (one pattern per line), filled externally.
# Changes are picked up without restarting Unbound (checked every reload_interval_s).
# Write files atomically: into a temporary file first, then rename into the directory.
domains_dir            = /opt/dns-to-bgp/domains.d
reload_interval_s      = 5
max_patterns           = 5000
