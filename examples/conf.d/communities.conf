# /opt/dns-to-bgp/conf.d/communities.conf - which BGP attributes a route gets,
# depending on the domain it was resolved from.
#
# A block is [pattern1, pattern2, ...] followed by keys (all optional). One FQDN
# can match several blocks at once: community and large_community ACCUMULATE
# over all matching blocks; next_hop / next_hop_v6 / as_path / local_pref / med
# are taken from the FIRST matching block in file order.
#
# Instead of (or together with) patterns, a block header may name a file from
# domains.d - any entry ending in .list, for example:
#
#   [corp.list, *.extra.example.com]
#
# The block then covers every pattern in that file (the same file the announcer
# reads). Edits are picked up without a restart. The directory is `domains_dir`
# in state.conf.
#
# Patterns: "*.example.com" matches subdomains only (never the apex);
#           "example.com" matches the apex only (never subdomains).
#
# Keys:
#   community        = ASN:VALUE[, ASN:VALUE ...]
#   large_community  = ASN:DATA1:DATA2[, ...]
#   next_hop         = IPv4 address   (for A routes)
#   next_hop_v6      = IPv6 address   (for AAAA routes)
#                      If unset, the per-family default from state.conf is used.
#                      An IPv4 address in next_hop_v6 (or vice versa) is not
#                      applied; a WARN is logged on load/reload.
#   as_path          = ASN[, ASN ...]
#   local_pref       = N
#   med              = N

[*.cdn.example.net, *.media.example.org]
community = 64512:100

# A second block with the full set of attributes. If the same FQDN also matched
# the block above, the communities would be merged, while next_hop / local_pref
# would come from whichever block is earlier in this file.
[*.video.example.com]
community        = 64512:100, 64512:900
large_community  = 64512:1:100
next_hop         = 198.51.100.1
next_hop_v6      = 2001:db8:100::1
# WARNING: do NOT put the BIRD ASN (neighbor_asn in state.conf) into as_path:
# BIRD sees an AS-path loop and silently drops the route. Use a different ASN.
as_path          = 64513
local_pref       = 150
med              = 10

# A list file from domains.d (examples/domains.d/corp.list) plus an extra pattern.
[corp.list, *.extra.example.com]
community = 64512:200

# Special block, not a pattern: applied ONLY to an FQDN that matched no block
# above (for example the domains.d lists and this file have drifted apart, so
# the Python module sent a domain this file does not know). Without it such a
# route would be announced with no community and be invisible to every
# community-based export filter on the router; the block makes the mismatch
# visible and classifiable instead of silently losing the community.
[default:missed]
community = 64512:999
