# Example BIRD 2.x protocol that receives routes from unbound-route-state.
# Adapt names, addresses, tables and filters to your setup.
#
# 192.0.2.10 - this BIRD instance, 192.0.2.11 - the unbound-route-state daemon
# (local_address in state.conf). Both can be addresses of one host (for example
# on a dummy interface) or of two different hosts.

filter dns_bgp_import {
    # Accept only host routes announced by the daemon; narrow this down further
    # by community if you need to, e.g.:  if (64512, 100) ~ bgp_community then ...
    if net.len = 32 || net.len = 128 then accept;
    reject;
}

protocol bgp dns_bgp_daemon {
    description "unbound-route-state";
    local 192.0.2.10 as 64512;
    # The daemon listens on port 1790 (not the privileged 179).
    neighbor 192.0.2.11 port 1790 as 64512;
    # Needed if the two addresses are not on a directly connected subnet.
    # multihop;

    graceful restart on;

    ipv4 {
        import filter dns_bgp_import;
        export none;
    };
    ipv6 {
        import filter dns_bgp_import;
        export none;
    };
}
