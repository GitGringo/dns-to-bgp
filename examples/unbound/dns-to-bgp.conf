# /etc/unbound/unbound.conf.d/dns-to-bgp.conf
server:
    # The Python module must be in the chain. Order matters: validator first.
    module-config: "validator python iterator"
    # pythonmod does not work under chroot.
    chroot: ""
    prefetch: yes

python:
    python-script: "/opt/dns-to-bgp/unbound-bgp-announcer/announcer.py"

# Needed only for `unbound-route-state ctl flush` and [unbound] flush_on_start:
remote-control:
    control-enable: yes
